<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proof Sigil</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <button class="sigil" type="button" aria-label="Input">
        <span class="sigil__background" data-background aria-hidden="true"></span>
        <span class="sigil__bits" data-bits aria-hidden="true"></span>
        <span class="sigil__line">
          <span class="sigil__input"><span data-input></span><span class="sigil__cursor" aria-hidden="true"></span></span>
          <span class="sigil__local">00 // LOCAL</span>
        </span>
      </button>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
